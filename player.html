<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#111;
    color:#fff;
}

#formContainer{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    gap:10px;
    padding:20px;
}

input{
    width:400px;
    max-width:70vw;
    padding:12px;
    font-size:16px;
}

button{
    padding:12px 20px;
    font-size:16px;
    cursor:pointer;
}

#iframeContainer{
    display:none;
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>

<body>

<div id="formContainer">
    <input
        type="text"
        id="imdbUrl"
        placeholder="Paste IMDb URL">
    <button onclick="loadMovie()">Submit</button>
</div>

<div id="iframeContainer">
    <iframe id="movieFrame" allowfullscreen></iframe>
</div>

<script>
function loadMovie() {
    const url = document.getElementById("imdbUrl").value.trim();

    const match = url.match(/tt\d+/);

    if (!match) {
        alert("Invalid IMDb URL");
        return;
    }

    const imdbId = match[0];

    const embedUrl =
        `https://proxy.garageband.rocks/embed/movie/${imdbId}`;

    document.getElementById("movieFrame").src = embedUrl;

    document.getElementById("formContainer").style.display = "none";
    document.getElementById("iframeContainer").style.display = "block";
}
</script>

</body>
</html>
